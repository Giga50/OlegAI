<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090d18">
  <meta name="description" content="OlegAI — персональный искусственный интеллект. Скоро запуск.">
  <title>OlegAI — скоро запуск</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #090d18;
      --text: #f4f7ff;
      --muted: #9ba9c2;
      --accent: #83adff;
      --line: #263550;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; flex-direction: column;
      background: radial-gradient(ellipse at 50% 0%, #1c3156, transparent 58%), var(--bg);
      color: var(--text); font-family: Inter, system-ui, sans-serif;
    }
    header, footer {
      width: min(1080px, calc(100% - 40px)); margin: 0 auto;
      display: flex; justify-content: space-between; align-items: center;
    }
    header { padding: 26px 0; }
    .brand { font-size: 22px; font-weight: 800; letter-spacing: -1px; }
    .brand span, h1 span { color: var(--accent); }
    .badge {
      font-size: 13px; color: #c2d1ec; border: 1px solid var(--line);
      padding: 8px 13px; border-radius: 30px; background: #111a2a;
    }
    main {
      width: min(850px, calc(100% - 40px)); margin: auto;
      text-align: center; padding: 85px 0 105px;
    }
    .logo {
      width: 88px; height: 88px; margin: 0 auto 30px; border-radius: 26px;
      background: linear-gradient(145deg, #a4c6ff, #426ed4);
      display: grid; place-items: center; box-shadow: 0 0 75px #5488ff55;
      transform: rotate(-7deg); font-size: 54px; font-weight: 850;
    }
    .eyebrow {
      color: var(--accent); font-size: 12px; font-weight: 750;
      letter-spacing: 3px; text-transform: uppercase;
    }
    h1 { font-size: clamp(48px, 9vw, 78px); line-height: 1.02; letter-spacing: -4px; margin: 18px 0; }
    p { max-width: 570px; margin: 0 auto; color: var(--muted); font-size: 18px; line-height: 1.7; }
    .soon {
      display: inline-flex; align-items: center; gap: 10px; margin-top: 38px;
      padding: 13px 19px; border: 1px solid var(--line); border-radius: 12px;
      background: #111a2b; color: #dce7ff; font-size: 14px;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 12px var(--accent); }
    footer { padding: 22px 0; border-top: 1px solid var(--line); color: #71819d; font-size: 12px; }
    @media (max-width: 520px) {
      main { padding: 65px 0 85px; }
      h1 { letter-spacing: -2px; }
      p { font-size: 16px; }
      footer { flex-direction: column; gap: 8px; text-align: center; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">Oleg<span>AI</span></div>
    <div class="badge">В разработке</div>
  </header>
  <main>
    <div class="logo" aria-hidden="true">O</div>
    <div class="eyebrow">Новый взгляд на ИИ</div>
    <h1>Знакомься.<br><span>OlegAI.</span></h1>
    <p>Персональный искусственный интеллект для идей, творчества и новых возможностей.</p>
    <div class="soon"><span class="dot"></span> Скоро запуск</div>
  </main>
  <footer>
    <span>© 2026 OlegAI</span>
    <span>Создаём будущее шаг за шагом</span>
  </footer>
</body>
</html>
