<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OlegAI — ИИ-помощник</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080c16;color:#f3f6ff;font:16px Arial,sans-serif}
.app{max-width:850px;margin:auto;height:100dvh;display:flex;flex-direction:column;padding:18px}
header{padding:15px;border-bottom:1px solid #263650;font-size:24px;font-weight:bold}
header span{color:#82adff}
#messages{flex:1;overflow-y:auto;padding:20px 0}
.msg{padding:13px 16px;margin:12px 0;border-radius:14px;background:#142039;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5}
.user{background:#203b5d}
.composer{display:flex;gap:10px}
textarea{flex:1;resize:none;background:#142039;color:white;border:1px solid #344766;border-radius:12px;padding:14px;font:inherit}
button{background:#82adff;color:#081326;border:0;border-radius:12px;padding:12px 20px;font-weight:bold}
small{color:#899bb8;text-align:center;padding:12px}
</style>
</head>
<body>
<div class="app">
<header>Oleg<span>AI</span></header>
<div id="messages">
<div class="msg">Привет! Я OlegAI. Чем могу помочь?</div>
</div>
<form class="composer" id="form">
<textarea id="input" rows="2" placeholder="Напиши сообщение..."></textarea>
<button id="send">➤</button>
</form>
<small>OlegAI · ИИ-помощник</small>
</div>

<script>
const API_URL = "https://olegai-api.djdhhfjfjf887.workers.dev";
const messages = document.querySelector("#messages");
const input = document.querySelector("#input");
const form = document.querySelector("#form");
const send = document.querySelector("#send");

const history = [];

function addMessage(text, type) {
  const div = document.createElement("div");
  div.className = "msg " + type;
  div.textContent = text;
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();

  const text = input.value.trim();
  if (!text || send.disabled) return;

  addMessage(text, "user");
  history.push({role:"user", content:text});

  input.value = "";
  send.disabled = true;

  const loading = document.createElement("div");
  loading.className = "msg";
  loading.textContent = "OlegAI думает...";
  messages.appendChild(loading);

  try {
    const response = await fetch(API_URL, {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({messages:history.slice(-12)})
    });

    const data = await response.json();
    loading.remove();

    if (!response.ok) {
      throw new Error(data.error || "Ошибка сервера");
    }

    const answer = data.response || "Модель не вернула ответ";
    addMessage(answer, "bot");
    history.push({role:"assistant",content:answer});

  } catch (error) {
    loading.remove();
    addMessage("Ошибка: " + error.message, "bot");
  }

  send.disabled = false;
  input.focus();
});
</script>
</body>
</html>
