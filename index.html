<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090d18">
<meta name="description" content="OlegAI — персональный ИИ-помощник.">
<title>OlegAI — твой ИИ-помощник</title>
<style>
:root{color-scheme:dark;--bg:#080c16;--panel:#101827;--line:#263650;--text:#f3f6ff;--muted:#9aa9c2;--blue:#82adff;--green:#72dfb0}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -20%,#1b3155 0,transparent 55%),var(--bg);color:var(--text);font:15px Inter,system-ui,sans-serif;min-height:100vh}
button,textarea{font:inherit}button{cursor:pointer}.app{max-width:1040px;height:100dvh;min-height:560px;margin:auto;padding:18px;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;padding:8px 2px 18px;border-bottom:1px solid var(--line)}
.brand{font-size:22px;font-weight:850;letter-spacing:-1px}.brand span{color:var(--blue)}.status{font-size:12px;color:var(--green);border:1px solid #285442;background:#10251f;padding:7px 11px;border-radius:30px}
main{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}.welcome{text-align:center;margin:auto 0 24px}.logo{width:62px;height:62px;margin:0 auto 17px;border-radius:20px;background:linear-gradient(145deg,#a4c6ff,#426ed4);display:grid;place-items:center;color:#071329;font-size:38px;font-weight:900;box-shadow:0 0 55px #5488ff44}.welcome h1{font-size:clamp(28px,5vw,42px);letter-spacing:-1.8px;margin:0 0 9px}.welcome h1 span{color:var(--blue)}.welcome p{color:var(--muted);margin:0}
.suggestions{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin-top:22px}.suggestions button{background:var(--panel);border:1px solid var(--line);color:#dce6fa;border-radius:12px;padding:10px 13px}.suggestions button:hover{border-color:var(--blue)}
.messages{display:none;overflow:auto;flex:1;padding:24px 2px;gap:17px;flex-direction:column}.msg{display:flex;gap:10px;max-width:82%;align-items:flex-start}.msg.user{align-self:flex-end;flex-direction:row-reverse}.avatar{flex:0 0 30px;width:30px;height:30px;border-radius:10px;background:#243a60;color:#cfe0ff;display:grid;place-items:center;font-weight:800}.user .avatar{background:#28523f;color:#c8ffe3}.bubble{padding:12px 15px;border:1px solid var(--line);background:var(--panel);border-radius:4px 15px 15px 15px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}.user .bubble{background:#172943;border-radius:15px 4px 15px 15px}
.composer{border:1px solid var(--line);background:var(--panel);border-radius:17px;padding:10px;display:flex;gap:10px;align-items:flex-end;box-shadow:0 12px 45px #0003}.composer textarea{flex:1;resize:none;max-height:140px;min-height:42px;background:transparent;border:0;outline:0;color:var(--text);padding:10px 8px;line-height:1.45}.composer textarea::placeholder{color:#74839d}.send{width:43px;height:43px;border:0;border-radius:12px;background:var(--blue);color:#081326;font-size:20px;font-weight:800}.send:disabled{opacity:.45;cursor:default}.hint{text-align:center;color:#71819b;font-size:11px;padding:10px 0 2px}.newchat{border:1px solid var(--line);background:transparent;color:var(--muted);padding:8px 11px;border-radius:10px;font-size:12px}
@media(max-width:600px){.app{padding:12px}.msg{max-width:94%}.welcome{margin-bottom:18px}.suggestions{gap:7px}.suggestions button{font-size:12px;padding:9px}.status{font-size:11px}}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="brand">Oleg<span>AI</span></div>
  <div style="display:flex;align-items:center;gap:10px">
    <span class="status">● Демо-режим</span>
    <button class="newchat" id="newchat">Новый чат</button>
  </div>
</header>
<main>
  <section class="welcome" id="welcome">
    <div class="logo">O</div>
    <h1>Привет! Я <span>OlegAI</span></h1>
    <p>Твой помощник для идей, учёбы и разработки.</p>
    <div class="suggestions">
      <button>Придумай идею приложения</button>
      <button>Объясни, как работает ИИ</button>
      <button>Помоги с кодом</button>
    </div>
  </section>
  <section class="messages" id="messages" aria-live="polite"></section>
</main>
<form class="composer" id="form">
  <textarea id="input" rows="1" placeholder="Напиши сообщение OlegAI..." aria-label="Сообщение"></textarea>
  <button class="send" id="send" aria-label="Отправить">↑</button>
</form>
<div class="hint">Демонстрационный режим: ответы подготовлены заранее, настоящая ИИ-модель пока не подключена.</div>
</div>
<script>
const welcome=document.querySelector('#welcome');
const messages=document.querySelector('#messages');
const input=document.querySelector('#input');
const form=document.querySelector('#form');
const send=document.querySelector('#send');

function addMessage(text,who){
  const row=document.createElement('div');
  row.className='msg '+who;
  const avatar=document.createElement('div');
  avatar.className='avatar';
  avatar.textContent=who==='user'?'Вы':'O';
  const bubble=document.createElement('div');
  bubble.className='bubble';
  bubble.textContent=text;
  row.append(avatar,bubble);
  messages.append(row);
  messages.scrollTop=messages.scrollHeight;
}

function demoReply(text){
  const q=text.toLowerCase();
  if(/привет|здравств|хай/.test(q))
    return 'Привет! Я OlegAI. Пока я работаю в демо-режиме, поэтому мои ответы заранее подготовлены. Подключение настоящей ИИ-модели — следующий этап.';
  if(/код|программ|html|python|сайт|разработ/.test(q))
    return 'Могу помочь спланировать разработку и разобрать код. Но сейчас это демонстрация: я ещё не подключён к языковой модели и не могу выполнять настоящий анализ кода.';
  if(/иде|приложен|проект/.test(q))
    return 'Идея для проекта: сделай приложение с личной базой заметок, поиском и ИИ-помощником. Начни с простого интерфейса, а затем добавь сервер и подключение модели.';
  if(/ии|искусствен|нейросет/.test(q))
    return 'ИИ-модель получает текст, обрабатывает его и генерирует ответ. Чтобы OlegAI стал настоящим помощником, сайту понадобится сервер, который безопасно обращается к API выбранной модели.';
  return 'Сообщение получено! Сейчас OlegAI находится в демо-режиме и не подключён к настоящей ИИ-модели. Поэтому я пока не могу полноценно ответить на этот вопрос.';
}

form.addEventListener('submit',e=>{
  e.preventDefault();
  const text=input.value.trim();
  if(!text)return;
  welcome.style.display='none';
  messages.style.display='flex';
  addMessage(text,'user');
  input.value='';
  input.style.height='auto';
  send.disabled=true;
  setTimeout(()=>{
    addMessage(demoReply(text),'bot');
    send.disabled=false;
    input.focus();
  },450);
});

input.addEventListener('input',()=>{
  input.style.height='auto';
  input.style.height=Math.min(input.scrollHeight,140)+'px';
});
input.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey){
    e.preventDefault();
    form.requestSubmit();
  }
});
document.querySelectorAll('.suggestions button').forEach(button=>{
  button.addEventListener('click',()=>{
    input.value=button.textContent;
    form.requestSubmit();
  });
});
document.querySelector('#newchat').addEventListener('click',()=>{
  messages.replaceChildren();
  messages.style.display='none';
  welcome.style.display='block';
  input.value='';
  input.focus();
});
</script>
</body>
</html>
